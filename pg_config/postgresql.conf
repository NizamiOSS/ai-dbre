# =============================================================================
# AI DBRE — PostgreSQL 16 Configuration for Agent Testing
# =============================================================================

listen_addresses = '*'
port = 5432

# --- Performance Monitoring Extensions ---
shared_preload_libraries = 'pg_stat_statements'

# --- pg_stat_statements settings ---
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on

# --- Slow Query Logging ---
log_min_duration_statement = 500          # Log queries taking > 500ms
log_statement = 'none'                    # Don't log all statements (noisy)
log_duration = off
log_line_prefix = '%t [%p] %u@%d '       # Timestamp, PID, user@database
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# --- Query Planning (useful for EXPLAIN analysis) ---
track_io_timing = on                      # Track I/O time in EXPLAIN BUFFERS
track_activities = on
track_counts = on
track_functions = all

# --- Connection Settings ---
max_connections = 100

# --- Memory (tuned for test environment) ---
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Autovacuum (keep defaults but make observable) ---
autovacuum = on
log_autovacuum_min_duration = 0           # Log all autovacuum runs
